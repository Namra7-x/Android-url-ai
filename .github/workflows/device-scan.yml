name: Device APK scan

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to scan
        required: true
        type: choice
        options: [all, chatgpt, claude, gemini]

permissions:
  contents: write

jobs:
  scan:
    # Requires a secured self-hosted runner labelled android-url-atlas with ADB,
    # analysis tools, and an authorised USB device attached.
    runs-on: [self-hosted, android-url-atlas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: adb devices
      - run: python scripts/acquire_adb.py --app "${expr}"
      - run: python -m url_atlas.cli scan --app "${expr}"
      - name: Commit reviewed reports and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/history
          git diff --cached --quiet || git commit -m "Update Android URL scan history"
          git push
