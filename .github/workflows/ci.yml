name: Android URL Atlas CI/CD

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: Which Android app to scan
        required: true
        type: choice
        default: all
        options: [all, chatgpt, claude, gemini]

concurrency:
  group: android-url-atlas-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      APK_APP: ${{ github.event.inputs.app || 'all' }}
      APK_DOWNLOAD_SOURCE: apk-pure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Ghidra and Apktool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Android and reverse-engineering tools
        run: bash scripts/install_ci_tools.sh

      - name: Run unit tests
        run: python -m pytest -q

      - name: Download current signed Android APKs
        run: python scripts/fetch_latest_apks.py

      - name: Run static URL extraction
        run: python -m url_atlas.cli scan --app "$APK_APP"

      - name: Upload reports and acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-url-atlas-${{ github.run_number }}
          path: |
            reports/
            work/logs/
            work/native/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit reviewed URL history and reports
        if: github.event_name != 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/history
          if git diff --cached --quiet; then
            echo "No report or URL-history changes."
          else
            git commit -m "Update Android app URL inventory"
            git push
          fi
