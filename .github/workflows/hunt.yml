name: Web Hunt Pipeline

# ONE-SHOT ONLY. No schedule. No push trigger.
# You start it manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      urls_file:
        description: "Path to the URL list"
        required: false
        default: "urls.txt"
      enable_subdomains:
        description: "Expand subdomains (true/false)"
        required: false
        default: "true"
      enable_uncover:
        description: "Query Shodan/Censys/etc (needs API key secret)"
        required: false
        default: "true"
      enable_urlscan:
        description: "Query urlscan.io (works with or without key)"
        required: false
        default: "true"
      enable_uro:
        description: "Deduplicate probe list with uro"
        required: false
        default: "true"
      enable_brute:
        description: "Run ffuf brute force (true/false)"
        required: false
        default: "true"
      enable_vhost:
        description: "Fuzz virtual hosts with ffuf (true/false)"
        required: false
        default: "true"
      enable_methods:
        description: "Test all HTTP methods on live routes (true/false)"
        required: false
        default: "true"
      enable_browser:
        description: "Run headless browser steps (true/false)"
        required: false
        default: "true"
      enable_kiterunner:
        description: "Run kiterunner API brute (true/false)"
        required: false
        default: "true"
      enable_arjun:
        description: "Run arjun hidden parameter discovery (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: web-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: bash scripts/install_tools.sh

      - name: Run hunt
        env:
          ENABLE_SUBDOMAINS: ${{ inputs.enable_subdomains }}
          ENABLE_UNCOVER: ${{ inputs.enable_uncover }}
          ENABLE_URLSCAN: ${{ inputs.enable_urlscan }}
          ENABLE_URO: ${{ inputs.enable_uro }}
          ENABLE_BRUTE: ${{ inputs.enable_brute }}
          ENABLE_VHOST: ${{ inputs.enable_vhost }}
          ENABLE_METHODS: ${{ inputs.enable_methods }}
          ENABLE_BROWSER: ${{ inputs.enable_browser }}
          ENABLE_KITERUNNER: ${{ inputs.enable_kiterunner }}
          ENABLE_ARJUN: ${{ inputs.enable_arjun }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          FOFA_EMAIL: ${{ secrets.FOFA_EMAIL }}
          FOFA_KEY: ${{ secrets.FOFA_KEY }}
          QUAKE_TOKEN: ${{ secrets.QUAKE_TOKEN }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          ZOOMEYE_API_KEY: ${{ secrets.ZOOMEYE_API_KEY }}
          NETLAS_API_KEY: ${{ secrets.NETLAS_API_KEY }}
          CRIMINALIP_API_KEY: ${{ secrets.CRIMINALIP_API_KEY }}
          PUBLICWWW_API_KEY: ${{ secrets.PUBLICWWW_API_KEY }}
          BINARYEDGE_API_KEY: ${{ secrets.BINARYEDGE_API_KEY }}
        run: |
          python3 scripts/hunt.py \
            --urls "${{ inputs.urls_file }}" \
            --out output \
            --settings config/settings.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-results
          path: output/
          retention-days: 30
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          if [ -f output/SUMMARY.md ]; then
            cat output/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in output/*/REPORT.md; do
            if [ -f "$f" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
