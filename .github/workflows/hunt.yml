name: Web Hunt Pipeline

# ONE-SHOT. Manual trigger only. ONE URL per run (no matrix, no concurrency limit issues).

on:
  workflow_dispatch:
    inputs:
      urls_file:
        description: "Path to URL list (one URL is recommended per run)"
        required: false
        default: "urls.txt"

permissions:
  contents: write

concurrency:
  group: web-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 22 LTS (Anastasis requires 20.18.1-23)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Install once. Every later run restores these paths from cache.
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hunt-tools-ready
            ~/go/bin
            ~/.local/bin
            ~/.cargo/bin
            ~/tools/Anastasis/node_modules
            ~/tools/Anastasis/dist
            ~/.npm
          key: hunt-tools-v1-${{ runner.os }}-${{ hashFiles('scripts/install_tools.sh') }}

      - name: Install tools (cached after first run)
        run: bash scripts/install_tools.sh

      - name: Run hunt
        run: |
          python3 scripts/hunt.py \
            --urls "${{ inputs.urls_file }}" \
            --out results \
            --settings config/settings.json

      # Results live in the repo so you can browse them — no download needed.
      - name: Commit results to repo
        if: always()
        run: |
          git config user.name "hunt-bot"
          git config user.email "hunt-bot@users.noreply.github.com"
          mkdir -p results
          find results -type f ! -path "*/chunks/*" ! -path "*/sourcemaps/*" -print0 \
            | xargs -0 -r git add -f
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Hunt results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload results (backup artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-results
          path: results/
          retention-days: 30
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          if [ -f results/INDEX.md ]; then
            cat results/INDEX.md >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in results/*/REPORT.md; do
            if [ -f "$f" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
